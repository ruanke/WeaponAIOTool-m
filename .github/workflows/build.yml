name: 手动构建并自动发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.0，留空则自动生成时间戳）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布版'
        type: boolean
        default: true

# 关键：授予写入权限以创建 Release
permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 可执行文件
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            pip install pyinstaller customtkinter
          }

      - name: 构建主程序
        run: |
          cd _sourceCode
          $iconArg = ""
          if (Test-Path icon.ico) {
            $iconArg = "--icon=icon.ico"
          }
          pyinstaller --onefile --windowed --name "WeaponAIOTool" --add-data "resources;resources" $iconArg weaponAIO.py

      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "pre-release-$(Get-Date -Format 'yyyyMMdd-HHmm')"
          }
          echo "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WeaponAIOTool-${{ steps.version.outputs.version }}
          path: _sourceCode/dist/WeaponAIOTool.exe

  release:
    name: 创建 Release 并上传附件
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.version != ''
    permissions:
      contents: write  # 确保有写入权限

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: WeaponAIOTool-${{ needs.build.outputs.version }}

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "WeaponAIOTool ${{ needs.build.outputs.version }}"
          body: |
            手动触发的构建版本：${{ needs.build.outputs.version }}
            触发人：${{ github.actor }}
            触发时间：${{ github.event.repository.updated_at }}
          files: WeaponAIOTool.exe
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}